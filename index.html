<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>题库智能查询系统</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #6366f1;
      --primary-dark: #3730a3;
      --secondary: #0ea5e9;
      --accent: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 24px rgba(79,70,229,.08);
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ========== HEADER ========== */
    header {
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, var(--secondary) 100%);
      color: #fff;
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 16px rgba(79,70,229,.25);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-icon {
      width: 36px; height: 36px;
      background: rgba(255,255,255,.2);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    header h1 { font-size: 20px; font-weight: 700; letter-spacing: .5px; }
    .badge-count {
      background: rgba(255,255,255,.22);
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 20px;
      padding: 3px 14px;
      font-size: 13px;
      font-weight: 600;
    }

    /* ========== UPLOAD ZONE ========== */
    #upload-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 64px);
      padding: 40px 24px;
    }
    .upload-card {
      background: var(--card);
      border-radius: 24px;
      padding: 60px 80px;
      text-align: center;
      box-shadow: var(--shadow);
      max-width: 520px;
      width: 100%;
      border: 2px dashed var(--border);
      transition: border-color .2s, box-shadow .2s;
    }
    .upload-card.drag-over {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(79,70,229,.12);
    }
    .upload-icon {
      font-size: 64px;
      margin-bottom: 24px;
      display: block;
      line-height: 1;
    }
    .upload-card h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .upload-card p { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }
    .btn-upload {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 13px 32px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s, transform .15s;
      box-shadow: 0 4px 14px rgba(79,70,229,.3);
    }
    .btn-upload:hover { opacity: .9; transform: translateY(-1px); }
    .btn-upload:active { transform: translateY(0); }
    #file-input { display: none; }
    .upload-hint {
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .format-tags { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
    .tag {
      background: #f1f5f9;
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* ========== MAIN LAYOUT ========== */
    #main-area { display: none; }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 24px 40px;
    }

    /* ========== STATS ROW ========== */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: var(--shadow);
    }
    .stat-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .stat-icon.purple { background: #ede9fe; }
    .stat-icon.blue   { background: #dbeafe; }
    .stat-icon.green  { background: #d1fae5; }
    .stat-icon.amber  { background: #fef3c7; }
    .stat-val { font-size: 26px; font-weight: 800; line-height: 1.1; }
    .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    /* ========== FILTER BAR ========== */
    .filter-bar {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: flex-end;
    }
    .filter-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 160px; }
    .filter-group label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; }
    .filter-group input,
    .filter-group select {
      height: 38px;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      padding: 0 12px;
      font-size: 14px;
      color: var(--text);
      background: #f8fafc;
      outline: none;
      transition: border-color .18s, box-shadow .18s;
      font-family: inherit;
    }
    .filter-group input:focus,
    .filter-group select:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(99,102,241,.13);
      background: #fff;
    }
    .filter-search { flex: 2; min-width: 220px; }
    .filter-search input { width: 100%; }
    .btn-reset {
      height: 38px;
      padding: 0 20px;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      background: #fff;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      transition: all .18s;
      white-space: nowrap;
    }
    .btn-reset:hover { border-color: var(--primary); color: var(--primary); }
    .btn-re-import {
      height: 38px;
      padding: 0 20px;
      border: none;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity .18s;
      white-space: nowrap;
    }
    .btn-re-import:hover { opacity: .88; }

    /* ========== RESULTS HEADER ========== */
    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .results-count { font-size: 14px; color: var(--text-muted); }
    .results-count strong { color: var(--primary); }
    .view-toggle { display: flex; gap: 6px; }
    .view-btn {
      width: 34px; height: 34px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      transition: all .15s;
    }
    .view-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* ========== QUESTION CARDS ========== */
    #results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 18px;
    }
    #results-grid.list-view {
      grid-template-columns: 1fr;
    }

    .q-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: transform .18s, box-shadow .18s;
      border: 1.5px solid transparent;
      cursor: default;
    }
    .q-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 32px rgba(79,70,229,.13);
      border-color: rgba(99,102,241,.2);
    }

    .q-card-header {
      padding: 14px 18px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .q-num {
      width: 28px; height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 600;
    }
    .chip-type { background: #ede9fe; color: #6d28d9; }
    .chip-diff-简单 { background: #d1fae5; color: #065f46; }
    .chip-diff-中等 { background: #fef3c7; color: #92400e; }
    .chip-diff-困难 { background: #fee2e2; color: #991b1b; }
    .chip-diff-default { background: #e2e8f0; color: #475569; }
    .chip-cat { background: #dbeafe; color: #1e40af; }

    .q-card-body { padding: 14px 18px; }
    .q-stem {
      font-size: 15px;
      font-weight: 500;
      line-height: 1.7;
      color: var(--text);
      margin-bottom: 12px;
      word-break: break-all;
    }
    .q-stem mark {
      background: #fef08a;
      color: inherit;
      border-radius: 3px;
      padding: 0 2px;
    }

    .q-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .q-option {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      background: #f8fafc;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 13px;
      color: var(--text);
      line-height: 1.5;
    }
    .q-option-label {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .q-option-text { word-break: break-all; }

    /* ========== EMPTY / LOADING ========== */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      grid-column: 1 / -1;
    }
    .empty-state .empty-icon { font-size: 56px; margin-bottom: 16px; }
    .empty-state h3 { font-size: 18px; color: var(--text-muted); }

    /* ========== PAGINATION ========== */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 32px;
      flex-wrap: wrap;
    }
    .page-btn {
      min-width: 36px; height: 36px;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      background: #fff;
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .15s;
      padding: 0 10px;
      font-family: inherit;
    }
    .page-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    .page-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 700; }
    .page-btn:disabled { opacity: .4; cursor: not-allowed; }

    /* ========== TOAST ========== */
    #toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #1e293b;
      color: #fff;
      border-radius: 12px;
      padding: 12px 22px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 8px 32px rgba(0,0,0,.18);
      z-index: 999;
      display: none;
      align-items: center;
      gap: 10px;
      animation: slideUp .25s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ========== SCROLLBAR ========== */
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* ========== ANSWER ========== */
    .q-answer-wrap {
      margin-top: 10px;
      border-top: 1px dashed var(--border);
      padding-top: 10px;
    }
    .btn-answer {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 30px;
      padding: 0 12px;
      border: 1.5px solid #10b981;
      border-radius: 20px;
      background: #f0fdf4;
      color: #065f46;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all .15s;
    }
    .btn-answer:hover { background: #d1fae5; }
    .answer-box {
      display: none;
      margin-top: 8px;
      background: linear-gradient(135deg, #f0fdf4, #ecfdf5);
      border: 1.5px solid #6ee7b7;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      color: #065f46;
      letter-spacing: .5px;
      animation: fadeIn .18s ease;
    }
    .answer-box.show { display: block; }
    .answer-label { font-size: 11px; font-weight: 600; color: #10b981; margin-bottom: 2px; text-transform: uppercase; letter-spacing: .5px; }

    /* global answer toggle */
    .btn-global-answer {
      height: 34px;
      padding: 0 14px;
      border: 1.5px solid #10b981;
      border-radius: 8px;
      background: #f0fdf4;
      color: #065f46;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all .15s;
      white-space: nowrap;
    }
    .btn-global-answer:hover { background: #d1fae5; }
    .btn-global-answer.active { background: #10b981; color: #fff; border-color: #10b981; }

    /* ========== OCR BUTTON ========== */
    .btn-ocr {
      height: 38px;
      padding: 0 16px;
      border: 1.5px solid #f59e0b;
      border-radius: 9px;
      background: #fffbeb;
      color: #b45309;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all .18s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-ocr:hover { background: #fef3c7; border-color: #d97706; }
    #ocr-photo-input { display: none; }

    /* ========== OCR MODAL ========== */
    .ocr-overlay {
      position: fixed; inset: 0;
      background: rgba(15,23,42,.55);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn .2s ease;
    }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .ocr-modal {
      background: #fff;
      border-radius: 20px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 24px 64px rgba(0,0,0,.2);
      overflow: hidden;
      animation: popIn .22s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes popIn {
      from { opacity:0; transform:scale(.92); }
      to   { opacity:1; transform:scale(1); }
    }
    .ocr-modal-header {
      padding: 18px 22px;
      background: linear-gradient(135deg, #f59e0b, #f97316);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .ocr-modal-header h3 { font-size: 16px; font-weight: 700; }
    .ocr-close {
      width: 30px; height: 30px;
      border: none;
      background: rgba(255,255,255,.22);
      border-radius: 8px;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      line-height: 1;
    }
    .ocr-close:hover { background: rgba(255,255,255,.35); }
    .ocr-modal-body { padding: 22px; }

    /* image preview */
    .ocr-preview-wrap {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--border);
      margin-bottom: 16px;
      min-height: 160px;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      color: var(--text-muted);
      font-size: 14px;
      position: relative;
    }
    .ocr-preview-wrap img {
      width: 100%;
      display: block;
      max-height: 280px;
      object-fit: contain;
      background: #f1f5f9;
    }
    .ocr-photo-btns {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .btn-cam, .btn-gallery {
      flex: 1;
      height: 42px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: #f8fafc;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all .15s;
      color: var(--text);
    }
    .btn-cam { border-color: #f59e0b; color: #b45309; background: #fffbeb; }
    .btn-cam:hover { background: #fef3c7; }
    .btn-gallery:hover { border-color: var(--primary); color: var(--primary); }

    /* OCR status bar */
    .ocr-status {
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 14px;
      display: none;
      align-items: center;
      gap: 10px;
    }
    .ocr-status.running { display:flex; background:#eff6ff; color:#1d4ed8; }
    .ocr-status.done    { display:flex; background:#f0fdf4; color:#166534; }
    .ocr-status.error   { display:flex; background:#fef2f2; color:#991b1b; }
    .ocr-spinner {
      width: 16px; height: 16px;
      border: 2px solid #bfdbfe;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ocr-progress { font-weight: 600; }

    /* recognized text */
    .ocr-result-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 6px;
    }
    #ocr-text-area {
      width: 100%;
      min-height: 80px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      resize: vertical;
      outline: none;
      transition: border-color .18s;
      line-height: 1.6;
    }
    #ocr-text-area:focus { border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(99,102,241,.13); }
    .ocr-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .btn-ocr-search {
      flex: 1;
      height: 42px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: opacity .18s;
    }
    .btn-ocr-search:hover { opacity: .88; }
    .btn-ocr-search:disabled { opacity: .45; cursor: not-allowed; }
    .btn-ocr-clear {
      height: 42px;
      padding: 0 18px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      transition: all .15s;
    }
    .btn-ocr-clear:hover { border-color: var(--danger); color: var(--danger); }

    @media (max-width: 640px) {
      .upload-card { padding: 40px 24px; }
      #results-grid { grid-template-columns: 1fr; }
      .q-options { grid-template-columns: 1fr; }
      .ocr-modal { border-radius: 16px; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-left">
    <div class="header-icon">📚</div>
    <h1>题库智能查询系统</h1>
  </div>
  <span class="badge-count" id="header-count" style="display:none"></span>
</header>

<!-- UPLOAD AREA -->
<div id="upload-area">
  <div class="upload-card" id="drop-zone">
    <span class="upload-icon">📊</span>
    <h2>导入题库文件</h2>
    <p>支持 Excel 格式，第一行为列标题<br>列顺序：题型 / 难易度 / 知识类别 / 题干 / 选项A~F</p>
    <button class="btn-upload" onclick="document.getElementById('file-input').click()">
      ＋ 选择文件
    </button>
    <input type="file" id="file-input" accept=".xlsx,.xls,.csv" />
    <div class="upload-hint">或将文件拖放至此区域</div>
    <div class="format-tags">
      <span class="tag">.xlsx</span>
      <span class="tag">.xls</span>
      <span class="tag">.csv</span>
    </div>
  </div>
</div>

<!-- MAIN AREA -->
<div id="main-area">
  <div class="container">

    <!-- STATS -->
    <div class="stats-row" id="stats-row"></div>

    <!-- FILTER BAR -->
    <div class="filter-bar">
      <div class="filter-group filter-search">
        <label>🔍 搜索题目</label>
        <input type="text" id="search-input" placeholder="输入关键字搜索题干或选项…" />
      </div>
      <div class="filter-group">
        <label>📋 题型</label>
        <select id="filter-type"><option value="">全部题型</option></select>
      </div>
      <div class="filter-group">
        <label>⚡ 难易度</label>
        <select id="filter-diff"><option value="">全部难度</option></select>
      </div>
      <div class="filter-group">
        <label>🏷 知识类别</label>
        <select id="filter-cat"><option value="">全部类别</option></select>
      </div>
      <button class="btn-ocr" onclick="openOcrModal()" title="拍照识题">📷 拍照识题</button>
      <button class="btn-reset" onclick="resetFilters()">重置</button>
      <button class="btn-re-import" onclick="reImport()">重新导入</button>
    </div>

    <!-- RESULTS HEADER -->
    <div class="results-header">
      <div class="results-count" id="results-count"></div>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="btn-global-answer" id="btn-global-answer" onclick="toggleAllAnswers()" style="display:none">✅ 显示所有答案</button>
        <div class="view-toggle">
          <button class="view-btn active" id="btn-grid" title="网格视图" onclick="setView('grid')">⊞</button>
          <button class="view-btn" id="btn-list" title="列表视图" onclick="setView('list')">☰</button>
        </div>
      </div>
    </div>

    <!-- RESULTS GRID -->
    <div id="results-grid"></div>

    <!-- PAGINATION -->
    <div class="pagination" id="pagination"></div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- OCR MODAL -->
<div class="ocr-overlay" id="ocr-overlay" style="display:none" onclick="handleOverlayClick(event)">
  <div class="ocr-modal" onclick="event.stopPropagation()">
    <div class="ocr-modal-header">
      <h3>📷 拍照识题 · OCR智能识别</h3>
      <button class="ocr-close" onclick="closeOcrModal()">✕</button>
    </div>
    <div class="ocr-modal-body">
      <!-- preview -->
      <div class="ocr-preview-wrap" id="ocr-preview-wrap">
        <span style="font-size:36px">🖼️</span>
        <span>预览区域</span>
      </div>

      <!-- camera / gallery buttons -->
      <div class="ocr-photo-btns">
        <button class="btn-cam" onclick="triggerCamera()">📸 调用摄像头拍照</button>
        <button class="btn-gallery" onclick="triggerGallery()">🖼️ 从相册选图</button>
      </div>
      <!-- hidden inputs -->
      <input type="file" id="ocr-cam-input" accept="image/*" capture="environment" style="display:none" />
      <input type="file" id="ocr-gallery-input" accept="image/*" style="display:none" />

      <!-- status -->
      <div class="ocr-status" id="ocr-status">
        <div class="ocr-spinner" id="ocr-spinner" style="display:none"></div>
        <span id="ocr-status-text"></span>
        <span class="ocr-progress" id="ocr-progress"></span>
      </div>

      <!-- result text -->
      <div class="ocr-result-label">识别结果（可手动修改后搜索）</div>
      <textarea id="ocr-text-area" placeholder="识别出的文字将显示在这里，您也可以直接粘贴文字…"></textarea>

      <div class="ocr-actions">
        <button class="btn-ocr-clear" onclick="clearOcr()">清空</button>
        <button class="btn-ocr-search" id="btn-ocr-search" onclick="doOcrSearch()">🔍 用识别文字查题</button>
      </div>
    </div>
  </div>
</div>

<script>
// ============ State ============
let allData = [];
let filtered = [];
let currentPage = 1;
const PAGE_SIZE = 20;
let currentView = 'grid';
let ocrWorker = null;

// ============ Column mapping ============
// A=0 B=1 C=2 D=3 E=4 F=5 G=6 H=7 I=8 J=9  K=10...
const COL = { type:0, diff:1, cat:2, stem:3, opts:[4,5,6,7,8,9] };
const OPT_LABELS = ['A','B','C','D','E','F'];
let answerCol = -1;       // detected answer column index, -1 = none
let showAllAnswers = false;

// ============ File input ============
document.getElementById('file-input').addEventListener('change', e => {
  if (e.target.files[0]) loadFile(e.target.files[0]);
});

// ============ Drag & Drop ============
const dropZone = document.getElementById('drop-zone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) loadFile(file);
});

// ============ Load file ============
function loadFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  const reader = new FileReader();
  reader.onload = e => {
    try {
      let rows = [];
      if (ext === 'csv') {
        const text = e.target.result;
        rows = parseCSV(text);
      } else {
        const wb = XLSX.read(e.target.result, { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
      }

      if (rows.length < 2) { showToast('⚠️ 文件内容为空或格式不正确'); return; }

      // Detect header row
      let startRow = 0;
      const firstRow = rows[0].map(c => String(c).trim());
      const isHeader = firstRow.some(c => ['题型','难易度','知识类别','题干'].includes(c));
      if (isHeader) startRow = 1;

      // Detect answer column from header
      answerCol = -1;
      if (isHeader) {
        const answerKeywords = ['答案','正确答案','参考答案','answer','correct'];
        answerCol = firstRow.findIndex(h => answerKeywords.some(k => h.toLowerCase().includes(k)));
      }
      // Fallback: if no header found, check column K (index 10) — use if non-empty data exists
      if (answerCol === -1) {
        const sample = rows.slice(startRow, startRow + 5);
        if (sample.some(r => String(r[10] ?? '').trim() !== '')) answerCol = 10;
      }

      allData = rows.slice(startRow).filter(r => r.some(c => String(c).trim() !== '')).map((r, i) => ({
        _id: i + 1,
        type:   String(r[COL.type] ?? '').trim(),
        diff:   String(r[COL.diff] ?? '').trim(),
        cat:    String(r[COL.cat]  ?? '').trim(),
        stem:   String(r[COL.stem] ?? '').trim(),
        opts:   COL.opts.map(ci => String(r[ci] ?? '').trim()).filter(v => v !== ''),
        answer: answerCol >= 0 ? String(r[answerCol] ?? '').trim() : ''
      }));

      if (allData.length === 0) { showToast('⚠️ 未读取到有效数据'); return; }

      initFilters();
      buildStats();
      applyFilters();
      showMainArea();
      // Show global answer button only if answer column exists
      const globalAnsBtn = document.getElementById('btn-global-answer');
      if (answerCol >= 0 && allData.some(d => d.answer)) {
        globalAnsBtn.style.display = 'inline-flex';
        const colLetter = String.fromCharCode(65 + answerCol);
        globalAnsBtn.title = `答案列：第${colLetter}列（索引${answerCol}）`;
      } else {
        globalAnsBtn.style.display = 'none';
      }
      showAllAnswers = false;
      showToast(`✅ 成功导入 ${allData.length} 道题目${answerCol >= 0 ? '（含答案列）' : ''}`);
    } catch (err) {
      showToast('❌ 文件解析失败：' + err.message);
    }
  };
  if (ext === 'csv') reader.readAsText(file, 'UTF-8');
  else reader.readAsArrayBuffer(file);
}

// Simple CSV parser
function parseCSV(text) {
  return text.split('\n').map(line => line.split(',').map(c => c.trim().replace(/^"|"$/g, '')));
}

// ============ UI switch ============
function showMainArea() {
  document.getElementById('upload-area').style.display = 'none';
  document.getElementById('main-area').style.display = 'block';
}
function reImport() {
  allData = []; filtered = []; currentPage = 1;
  document.getElementById('upload-area').style.display = 'flex';
  document.getElementById('main-area').style.display = 'none';
  document.getElementById('header-count').style.display = 'none';
  document.getElementById('file-input').value = '';
}

// ============ Stats ============
function buildStats() {
  const types = [...new Set(allData.map(d => d.type).filter(Boolean))];
  const cats  = [...new Set(allData.map(d => d.cat).filter(Boolean))];
  const diffs = [...new Set(allData.map(d => d.diff).filter(Boolean))];
  const total = allData.length;
  document.getElementById('stats-row').innerHTML = `
    <div class="stat-card">
      <div class="stat-icon purple">📝</div>
      <div><div class="stat-val">${total}</div><div class="stat-label">题目总数</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon blue">📋</div>
      <div><div class="stat-val">${types.length}</div><div class="stat-label">题目类型</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon green">🏷</div>
      <div><div class="stat-val">${cats.length}</div><div class="stat-label">知识类别</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon amber">⚡</div>
      <div><div class="stat-val">${diffs.length}</div><div class="stat-label">难易等级</div></div>
    </div>
  `;
  document.getElementById('header-count').textContent = `共 ${total} 题`;
  document.getElementById('header-count').style.display = 'inline-flex';
}

// ============ Filters init ============
function initFilters() {
  fillSelect('filter-type', [...new Set(allData.map(d => d.type).filter(Boolean))]);
  fillSelect('filter-diff', [...new Set(allData.map(d => d.diff).filter(Boolean))]);
  fillSelect('filter-cat',  [...new Set(allData.map(d => d.cat).filter(Boolean))]);
  ['search-input','filter-type','filter-diff','filter-cat'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => { currentPage = 1; applyFilters(); });
    document.getElementById(id).addEventListener('change', () => { currentPage = 1; applyFilters(); });
  });
}
function fillSelect(id, vals) {
  const sel = document.getElementById(id);
  const first = sel.options[0];
  sel.innerHTML = '';
  sel.appendChild(first);
  vals.sort().forEach(v => {
    const o = document.createElement('option');
    o.value = v; o.textContent = v;
    sel.appendChild(o);
  });
}
function resetFilters() {
  document.getElementById('search-input').value = '';
  document.getElementById('filter-type').value = '';
  document.getElementById('filter-diff').value = '';
  document.getElementById('filter-cat').value = '';
  currentPage = 1;
  applyFilters();
}

// ============ Filter logic ============
function applyFilters() {
  const kw   = document.getElementById('search-input').value.trim().toLowerCase();
  const type = document.getElementById('filter-type').value;
  const diff = document.getElementById('filter-diff').value;
  const cat  = document.getElementById('filter-cat').value;

  filtered = allData.filter(d => {
    if (type && d.type !== type) return false;
    if (diff && d.diff !== diff) return false;
    if (cat  && d.cat  !== cat)  return false;
    if (kw) {
      const hay = [d.stem, ...d.opts].join(' ').toLowerCase();
      if (!hay.includes(kw)) return false;
    }
    return true;
  });

  const cnt = filtered.length;
  document.getElementById('results-count').innerHTML =
    `共找到 <strong>${cnt}</strong> 道题目` + (cnt !== allData.length ? `（全库 ${allData.length} 题）` : '');

  renderPage();
  renderPagination();
}

// ============ Render ============
function renderPage() {
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageItems = filtered.slice(start, start + PAGE_SIZE);
  const kw = document.getElementById('search-input').value.trim();
  const grid = document.getElementById('results-grid');

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><h3>没有找到匹配的题目</h3></div>`;
    return;
  }

  grid.innerHTML = pageItems.map((d, idx) => buildCard(d, start + idx + 1, kw)).join('');
}

function buildCard(d, num, kw) {
  const diffClass = ['简单','中等','困难'].includes(d.diff) ? `chip-diff-${d.diff}` : 'chip-diff-default';
  const stem = kw ? highlight(d.stem, kw) : escHtml(d.stem);
  const opts = d.opts.map((o, i) => {
    const txt = kw ? highlight(o, kw) : escHtml(o);
    return `<div class="q-option">
      <div class="q-option-label">${OPT_LABELS[i]}</div>
      <div class="q-option-text">${txt}</div>
    </div>`;
  }).join('');
  const hasAnswer = d.answer && d.answer !== '';
  const answerHtml = hasAnswer ? `
    <div class="q-answer-wrap">
      <button class="btn-answer" onclick="toggleAnswer(this)">
        <span>👁</span><span>显示答案</span>
      </button>
      <div class="answer-box ${showAllAnswers ? 'show' : ''}">
        <div class="answer-label">正确答案</div>
        ${escHtml(d.answer)}
      </div>
    </div>` : '';
  return `
  <div class="q-card">
    <div class="q-card-header">
      <div class="q-num">${num}</div>
      ${d.type ? `<span class="chip chip-type">${escHtml(d.type)}</span>` : ''}
      ${d.diff ? `<span class="chip ${diffClass}">${escHtml(d.diff)}</span>` : ''}
      ${d.cat  ? `<span class="chip chip-cat">${escHtml(d.cat)}</span>` : ''}
    </div>
    <div class="q-card-body">
      <div class="q-stem">${stem}</div>
      ${opts ? `<div class="q-options">${opts}</div>` : ''}
      ${answerHtml}
    </div>
  </div>`;
}

function toggleAnswer(btn) {
  const box = btn.nextElementSibling;
  const showing = box.classList.toggle('show');
  btn.querySelector('span:last-child').textContent = showing ? '隐藏答案' : '显示答案';
  btn.querySelector('span:first-child').textContent = showing ? '🙈' : '👁';
}

function toggleAllAnswers() {
  showAllAnswers = !showAllAnswers;
  const btn = document.getElementById('btn-global-answer');
  btn.textContent = showAllAnswers ? '🙈 隐藏所有答案' : '✅ 显示所有答案';
  btn.classList.toggle('active', showAllAnswers);
  document.querySelectorAll('.answer-box').forEach(box => {
    box.classList.toggle('show', showAllAnswers);
  });
  document.querySelectorAll('.btn-answer span:last-child').forEach(s => {
    s.textContent = showAllAnswers ? '隐藏答案' : '显示答案';
  });
  document.querySelectorAll('.btn-answer span:first-child').forEach(s => {
    s.textContent = showAllAnswers ? '🙈' : '👁';
  });
}

function highlight(text, kw) {
  if (!kw) return escHtml(text);
  const escaped = escHtml(text);
  const re = new RegExp(escRe(kw), 'gi');
  return escaped.replace(re, m => `<mark>${m}</mark>`);
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

// ============ OCR ============
function openOcrModal() {
  document.getElementById('ocr-overlay').style.display = 'flex';
}
function closeOcrModal() {
  document.getElementById('ocr-overlay').style.display = 'none';
}
function handleOverlayClick(e) {
  if (e.target === document.getElementById('ocr-overlay')) closeOcrModal();
}
function triggerCamera() {
  document.getElementById('ocr-cam-input').click();
}
function triggerGallery() {
  document.getElementById('ocr-gallery-input').click();
}
function clearOcr() {
  document.getElementById('ocr-text-area').value = '';
  const wrap = document.getElementById('ocr-preview-wrap');
  wrap.innerHTML = '<span style="font-size:36px">🖼️</span><span>预览区域</span>';
  setOcrStatus('', '');
}
function setOcrStatus(type, msg, progress) {
  const el = document.getElementById('ocr-status');
  el.className = 'ocr-status' + (type ? ' ' + type : '');
  document.getElementById('ocr-status-text').textContent = msg;
  document.getElementById('ocr-progress').textContent = progress || '';
  document.getElementById('ocr-spinner').style.display = type === 'running' ? 'block' : 'none';
}

async function runOcr(file) {
  const url = URL.createObjectURL(file);
  const wrap = document.getElementById('ocr-preview-wrap');
  wrap.innerHTML = `<img src="${url}" alt="预览" />`;

  setOcrStatus('running', '正在加载OCR引擎…', '');
  document.getElementById('btn-ocr-search').disabled = true;

  try {
    if (!ocrWorker) {
      ocrWorker = await Tesseract.createWorker('chi_sim+eng', 1, {
        logger: m => {
          if (m.status === 'recognizing text') {
            setOcrStatus('running', '识别中，请稍候…', Math.round(m.progress * 100) + '%');
          } else if (m.status === 'loading tesseract core') {
            setOcrStatus('running', '加载OCR核心…', '');
          } else if (m.status === 'initializing tesseract') {
            setOcrStatus('running', '初始化引擎…', '');
          } else if (m.status === 'loading language traineddata') {
            setOcrStatus('running', '加载中文语言包…（首次需下载，约15MB）', '');
          } else if (m.status === 'initializing api') {
            setOcrStatus('running', '初始化API…', '');
          }
        }
      });
    }
    setOcrStatus('running', '识别中，请稍候…', '');
    const { data: { text } } = await ocrWorker.recognize(file);
    const cleaned = text.replace(/\s+/g, ' ').trim();
    document.getElementById('ocr-text-area').value = cleaned;
    setOcrStatus('done', '✅ 识别完成，可手动修改后点击查题', '');
    document.getElementById('btn-ocr-search').disabled = false;
  } catch (err) {
    setOcrStatus('error', '❌ 识别失败：' + err.message, '');
    document.getElementById('btn-ocr-search').disabled = false;
  }
}

function doOcrSearch() {
  const text = document.getElementById('ocr-text-area').value.trim();
  if (!text) { showToast('⚠️ 请先拍照或输入识别文字'); return; }
  // Take first 30 chars as keyword
  const kw = text.replace(/[\n\r]/g,' ').replace(/\s+/g,' ').trim().slice(0, 30);
  document.getElementById('search-input').value = kw;
  currentPage = 1;
  applyFilters();
  closeOcrModal();
  showToast(`🔍 已用「${kw}」搜索题目`);
  document.getElementById('search-input').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

document.getElementById('ocr-cam-input').addEventListener('change', e => {
  if (e.target.files[0]) runOcr(e.target.files[0]);
});
document.getElementById('ocr-gallery-input').addEventListener('change', e => {
  if (e.target.files[0]) runOcr(e.target.files[0]);
});
document.getElementById('ocr-text-area').addEventListener('paste', e => {
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      e.preventDefault();
      const file = item.getAsFile();
      if (file) runOcr(file);
      break;
    }
  }
});

// ============ Pagination ============
function renderPagination() {
  const total = Math.ceil(filtered.length / PAGE_SIZE);
  const pg = document.getElementById('pagination');
  if (total <= 1) { pg.innerHTML = ''; return; }

  let html = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
  for (let i = 1; i <= total; i++) {
    if (total > 9 && Math.abs(i - currentPage) > 2 && i !== 1 && i !== total) {
      if (i === 2 || i === total - 1) html += `<span style="padding:0 4px;color:var(--text-muted)">…</span>`;
      continue;
    }
    html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
  }
  html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===total?'disabled':''}>›</button>`;
  pg.innerHTML = html;
}
function goPage(p) {
  const total = Math.ceil(filtered.length / PAGE_SIZE);
  if (p < 1 || p > total) return;
  currentPage = p;
  renderPage();
  renderPagination();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============ View toggle ============
function setView(v) {
  currentView = v;
  const grid = document.getElementById('results-grid');
  grid.classList.toggle('list-view', v === 'list');
  document.getElementById('btn-grid').classList.toggle('active', v === 'grid');
  document.getElementById('btn-list').classList.toggle('active', v === 'list');
}

// ============ Toast ============
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'flex';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.display = 'none'; }, 3000);
}
</script>
</body>
</html>
